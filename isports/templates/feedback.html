{% extends 'base.html' %}
{% load static %}

{% block title %}Feedback - iSports{% endblock %}

{% block extra_css %}
<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent-glow: rgba(196, 34, 33, 0.3);
    }

    .feedback-page {
        padding: 160px 0 100px;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #1a202c 0%, #0b0e11 100%);
        position: relative;
        overflow: hidden;
    }

    /* Abstract background elements */
    .feedback-page::before {
        content: '';
        position: absolute;
        width: 400px;
        height: 400px;
        background: var(--accent-color);
        filter: blur(150px);
        opacity: 0.1;
        top: -100px;
        right: -100px;
        z-index: 0;
    }

    .feedback-container {
        position: relative;
        z-index: 1;
    }

    .feedback-header h1 {
        font-size: 4rem;
        letter-spacing: -1px;
        margin-bottom: 1rem;
        background: linear-gradient(to bottom, #fff 0%, #aaa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .feedback-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        padding: 60px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        max-width: 800px;
        margin: 0 auto;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .feedback-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
    }

    .form-group-custom {
        position: relative;
        margin-bottom: 40px;
    }

    .form-control-custom {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 18px 24px;
        color: #fff;
        font-size: 16px;
        transition: all 0.3s ease;
        outline: none;
    }

    .form-control-custom:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 20px var(--accent-glow);
        background: rgba(0, 0, 0, 0.3);
    }

    .label-custom {
        display: block;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 12px;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 2px;
        margin-left: 4px;
    }

    .star-rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: center;
        gap: 15px;
        margin: 20px 0 40px;
    }

    .star-rating input {
        display: none;
    }

    .star-rating label {
        color: rgba(255, 255, 255, 0.1);
        font-size: 40px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .star-rating label:hover,
    .star-rating label:hover ~ label {
        color: #ffd700;
        transform: scale(1.2) rotate(10deg);
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .star-rating input:checked ~ label {
        color: #ffc107;
        text-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
    }

    .submit-btn-premium {
        background: var(--accent-color);
        color: #fff;
        border: none;
        padding: 20px 60px;
        border-radius: 100px;
        font-family: var(--accent-font);
        font-size: 22px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(196, 34, 33, 0.3);
    }

    .submit-btn-premium:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(196, 34, 33, 0.5);
        background: #d62a29;
    }

    .submit-btn-premium:active {
        transform: translateY(-2px);
    }

    .submit-btn-premium::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        transform: rotate(45deg);
        transition: all 0.6s ease;
    }

    .submit-btn-premium:hover::after {
        left: 100%;
    }

    /* Override Django default styles */
    textarea.form-control-custom {
        min-height: 180px;
        resize: none;
    }

    .wow-fade-in {
        animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="feedback-page">
    <div class="container feedback-container">
        <div class="row align-items-center justify-content-center">
            <div class="col-lg-12 text-center mb-5 feedback-header">
                <h3 class="text-white-50 mb-2 wow-fade-in">WE VALUE YOUR VOICE</h3>
                <h1 class="font-weight-bold wow-fade-in" style="animation-delay: 0.1s;">Share Your <span style="color: var(--accent-color);">Experience</span></h1>
                <p class="lead text-white-50 mt-3 wow-fade-in" style="animation-delay: 0.2s;">Your feedback shapes the future of iSports.</p>
            </div>
            
            <div class="col-lg-10">
                <div class="feedback-card wow-fade-in" style="animation-delay: 0.3s;">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group-custom">
                                    <label for="id_subject" class="label-custom">Subject of Interest</label>
                                    <input type="text" name="subject" class="form-control-custom" id="id_subject" placeholder="What would you like to discuss?" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-5 text-center">
                            <label class="label-custom">Overall Satisfaction</label>
                            {{ form.rating }}
                            <div class="star-rating">
                                <input type="radio" id="star5" name="rating-view" value="5" checked onchange="document.getElementById('rating-value').value=this.value"><label for="star5" title="Exceptional"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star4" name="rating-view" value="4" onchange="document.getElementById('rating-value').value=this.value"><label for="star4" title="Great"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star3" name="rating-view" value="3" onchange="document.getElementById('rating-value').value=this.value"><label for="star3" title="Good"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star2" name="rating-view" value="2" onchange="document.getElementById('rating-value').value=this.value"><label for="star2" title="Fair"><i class="fas fa-star"></i></label>
                                <input type="radio" id="star1" name="rating-view" value="1" onchange="document.getElementById('rating-value').value=this.value"><label for="star1" title="Poor"><i class="fas fa-star"></i></label>
                            </div>
                        </div>

                        <div class="form-group-custom">
                            <label for="id_message" class="label-custom">Your Message</label>
                            <textarea name="message" id="id_message" class="form-control-custom" placeholder="Tell us more about your thoughts..."></textarea>
                        </div>

                        <div class="text-center mt-5">
                            <button type="submit" class="submit-btn-premium">
                                SUBMIT FEEDBACK <i class="fas fa-paper-plane ms-2" style="font-size: 18px;"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
