{% extends 'base.html' %}
{% load static %}

{% block title %}Register - iSports{% endblock %}

{% block content %}
    <!-- Register Section Start -->
    <div class="hero dark-section" style="padding: 150px 0 100px;">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8 offset-lg-2">
                    <div class="contact-form" style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 40px;">
                        <div class="section-title mb-4">
                            <h3 class="wow fadeInUp" style="font-size: 1.2rem; color: var(--accent-color);">Join Us</h3>
                            <h2 class="text-anime-style-2" data-cursor="-opaque" style="font-size: 2.5rem;">Register for <span>iSports</span></h2>
                        </div>
                        
                        <form action="#" method="POST" data-toggle="validator" class="wow fadeInUp" data-wow-delay="0.2s">
                            {% csrf_token %}
                            <div class="row">
                                <div class="form-group col-md-6 mb-4">
                                    <label class="text-white-50 small mb-2">First Name</label>
                                    <input type="text" name="first_name" class="form-control" id="first_name" placeholder="John" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; padding: 12px 20px;">
                                    <div class="help-block with-errors"></div>
                                </div>

                                <div class="form-group col-md-6 mb-4">
                                    <label class="text-white-50 small mb-2">Last Name</label>
                                    <input type="text" name="last_name" class="form-control" id="last_name" placeholder="Doe" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; padding: 12px 20px;">
                                    <div class="help-block with-errors"></div>
                                </div>

                                <div class="form-group col-md-12 mb-4">
                                    <label class="text-white-50 small mb-2">Username</label>
                                    <input type="text" name="username" class="form-control" id="username" placeholder="johndoe123" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; padding: 12px 20px;">
                                    <div class="help-block with-errors"></div>
                                </div>

                                <div class="form-group col-md-12 mb-4">
                                    <label class="text-white-50 small mb-2">Email Address</label>
                                    <input type="email" name="email" class="form-control" id="email" placeholder="john@example.com" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; padding: 12px 20px;">
                                    <div class="help-block with-errors"></div>
                                </div>

                                <div class="form-group col-md-12 mb-4">
                                    <label class="text-white-50 small mb-2">Password</label>
                                    <input type="password" name="password" class="form-control" id="password" placeholder="Create a password" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; padding: 12px 20px;">
                                    <div class="help-block with-errors"></div>
                                </div>

                                <div class="col-md-12">
                                    <button type="submit" class="btn-default w-100" style="border-radius: 12px; padding: 14px;">Register Now</button>
                                </div>
                                
                                <div class="col-md-12 mt-4 text-center">
                                    <p class="text-white-50 small">Already have an account? <a href="{% url 'login' %}" class="text-accent fw-bold" style="color: var(--accent-color) !important;">Login here</a></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Register Section End -->
{% endblock %}
